# Fork-only verification lane.
#
# Upstream's CI routes its Linux enterprise jobs (static, lint, coverage, snapshots)
# to the custom runner label `dsh-ubuntu-24-04-16core`, or to a Blacksmith or
# self-hosted failover pool selected by DSH_CI_FAILOVER_LINUX. This fork registers
# none of those, so those jobs stay queued forever here while the jobs on the
# free GitHub-hosted image (benchmarks, the Node compatibility matrix) run.
#
# This workflow runs the same commands on ubuntu-24.04, the free GitHub-hosted
# image, so a fork can close the type-check and lint gates without a paid or
# self-hosted runner. It reads the repository only: no secrets, no publish, no
# deploy, no external service.
name: Fork verification

on:
  pull_request:
  workflow_dispatch:
    inputs:
      baseline:
        description: Compare the failing benchmark lane against the fixed upstream tag.
        type: boolean
        default: false
      upstream_ref:
        description: Upstream tag to check out for the baseline comparison.
        type: string
        default: dsh-v0.2.2-rc.3

permissions:
  contents: read

concurrency:
  group: fork-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-lint:
    name: typecheck and lint (hosted)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The archive gate reads the trusted PR base commit.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # package.json requires Node >= 24.9.0.
          node-version: '24.9'

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # Same step as the upstream lint job: oxlint's type-aware rules read the
      # compiled package declarations.
      - name: Compile package declarations
        run: pnpm run typecheck

      - name: Run lint and duplication
        run: pnpm run check:ci:lint:contracts-ready

  benchmark-reproduction:
    name: benchmark lane (hosted, dispatch only)
    # A failing benchmark needs one reproduction on an idle hosted runner; keep it
    # out of the pull-request lane so it never competes with the gates above.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.9'

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Install benchmark browser and hosted dependencies
        run: pnpm --filter @deepseek-ai/dsh-benchmarks exec playwright install --with-deps chromium

      - name: Run performance benchmarks
        env:
          DSH_GATE_VERBOSE: '1'
        run: pnpm run check:ci:bench

  # Baseline comparison for one failing lane. The upstream tag is checked out in a
  # separate git worktree inside the runner workspace, so both trees build their own
  # dependencies from their own lockfile and run the identical command.
  baseline-bench:
    name: baseline benchmark (${{ matrix.tree }})
    if: github.event_name == 'workflow_dispatch' && inputs.baseline == true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        tree: [fork, upstream]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the fixed upstream tag in a worktree
        if: matrix.tree == 'upstream'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 https://github.com/deepseek-ai/deepseek-harness.git "refs/tags/${{ inputs.upstream_ref }}:refs/tags/baseline-upstream"
          git worktree add ../baseline "refs/tags/baseline-upstream"
          git -C ../baseline rev-parse HEAD

      - name: Record the checked-out commit
        id: tree
        run: |
          set -euo pipefail
          if [ "${{ matrix.tree }}" = "upstream" ]; then
            echo "dir=../baseline" >> "$GITHUB_OUTPUT"
            echo "sha=$(git -C ../baseline rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.9'

      - name: Install (immutable)
        working-directory: ${{ steps.tree.outputs.dir }}
        run: pnpm install --frozen-lockfile

      - name: Install benchmark browser
        working-directory: ${{ steps.tree.outputs.dir }}
        run: pnpm --filter @deepseek-ai/dsh-benchmarks exec playwright install --with-deps chromium

      - name: Build benchmark artifacts
        working-directory: ${{ steps.tree.outputs.dir }}
        run: |
          set -euo pipefail
          pnpm run build:bench
          pnpm run build:web

      # Mirror run-bench-suite.ts phase "last": the browser case runs alone with the
      # report phase set, which is how CI actually executes this file.
      - name: Run the exact failing benchmark file
        id: bench
        working-directory: ${{ steps.tree.outputs.dir }}
        continue-on-error: true
        env:
          DSH_GATE_VERBOSE: '1'
          DSH_BENCH_REPORT_PHASE: last
        run: |
          set -uo pipefail
          pnpm exec vitest run --config vitest.bench.config.ts --no-file-parallelism --maxWorkers=1 benchmarks/long-session-browser/long-session.bench.ts
          echo "bench_exit=$?"

      - name: Summary
        if: always()
        run: |
          echo "tree=${{ matrix.tree }} sha=${{ steps.tree.outputs.sha }} bench_outcome=${{ steps.bench.outcome }}"
